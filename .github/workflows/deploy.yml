name: Deploy to GitHub Pages

on:
  # 推送到 main 就构建并部署
  push:
    branches: [main]
  # 也可以在 Actions 页面手动触发
  workflow_dispatch:

# 允许工作流读取仓库并发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只保留一个进行中的部署；正在跑的部署不打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 版本取自 package.json 的 packageManager 字段
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 每次部署前重新扫一遍 GitHub Pages 站点列表，
      # 这样在别处新开的 Pages 不用改代码就会出现在 /sites 页上。
      # 脚本只依赖 Node 内置 fetch；失败时会保留仓库里已提交的数据，不会让构建挂掉。
      - name: Sync GitHub Pages sites
        run: pnpm sync:sites
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
