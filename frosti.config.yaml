# 网站的基本信息
site:
  tab: "wzk 的技术笔记" # 浏览器标签栏上显示的文本
  title: "wzk 的技术笔记" # 网站的标题
  description: "Android 逆向 · 移动安全 · 工具链。记录脱壳、反调试、Frida 与逆向工程工具链的实践笔记。" # 用于 SEO
  language: zh # 界面文案语言，可选 en / zh / fr / ja / ko / es / de / ru / pt / it
  favicon: /favicon.ico
  theme: # 更多主题见 https://daisyui.com/docs/themes/
    light: emerald # 浅色模式
    dark: forest # 深色模式
    code: github-dark # 代码块高亮主题 https://expressive-code.com/guides/themes/
  date_format: YYYY-MM-DD # dayjs 日期格式
  blog:
    pageSize: 8 # 文章列表每页条数
  menu: # 顶部菜单
    - id: home
      text: 首页
      href: /
      svg: "material-symbols:home-outline-rounded"
      target: _self
    - id: blog
      text: 博客
      href: /blog
      svg: "material-symbols:book-2-outline-rounded"
      target: _self
    - id: project
      text: 项目
      href: /project
      svg: "material-symbols:code-blocks-outline"
      target: _self
    - id: about
      text: 关于
      href: /about
      svg: "material-symbols:info-outline-rounded"
      target: _self
    - id: github
      text: GitHub
      href: "https://github.com/425zekunwang"
      svg: "ri:github-line"
      target: _blank

# 用户的个人信息
user:
  name: wzk
  site: "https://425zekunwang.github.io" # 站点地址，同时作为 astro 的 site（影响 RSS、sitemap、canonical）
  avatar: /profile.png # 以 / 开头表示相对 public 目录；必须是 PNG（OG 图片用 satori 生成，不吃 SVG）
  sidebar: # 侧边栏社交图标
    social:
      - href: "https://github.com/425zekunwang"
        ariaLabel: GitHub
        title: GitHub
        svg: "ri:github-line"
      - href: "https://425zekunwang.github.io/android_reverse_simulator/"
        ariaLabel: 安卓逆向课程模拟器
        title: 安卓逆向课程模拟器
        svg: "ri:graduation-cap-line"
      - href: "https://425zekunwang.github.io/rss.xml"
        ariaLabel: RSS 订阅
        title: RSS 订阅
        svg: "ri:rss-line"
  footer: # 页脚社交图标
    social:
      - href: "https://github.com/425zekunwang"
        ariaLabel: GitHub
        title: GitHub
        svg: "ri:github-line"
      - href: "https://425zekunwang.github.io/rss.xml"
        ariaLabel: RSS 订阅
        title: RSS 订阅
        svg: "ri:rss-line"
